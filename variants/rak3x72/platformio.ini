[rak3x72]
extends = stm32_base
board = rak3172
board_upload.maximum_size = 229376 ; 32kb for FS
build_flags = ${stm32_base.build_flags}
  -D RAK_3X72
  -D RADIO_CLASS=CustomSTM32WLx
  -D WRAPPER_CLASS=CustomSTM32WLxWrapper
  -D SPI_INTERFACES_COUNT=0
  -D RX_BOOSTED_GAIN=true
;  -D STM32WL_TCXO_VOLTAGE=1.6 ; defaults to 0 if undef
;  -D LORA_TX_POWER=14 ; Defaults to 22 for HP, 14 is for LP version
  -I variants/rak3x72
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/rak3x72>

[env:RAK_3x72_repeater]
extends = rak3x72
build_flags = ${rak3x72.build_flags}
  -D ADVERT_NAME='"RAK3x72 Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${rak3x72.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:RAK_3x72_sensor]
extends = rak3x72
build_flags = ${rak3x72.build_flags}
  -D ADVERT_NAME='"RAK3x72 Sensor"'
  -D ADMIN_PASSWORD='"password"'
build_src_filter = ${rak3x72.build_src_filter}
  +<../examples/simple_sensor>

[env:RAK_3x72_relay]
extends = rak3x72
build_flags = ${rak3x72.build_flags}
  -D ADVERT_NAME='"RAK3x72 Relay"'
  -D ADMIN_PASSWORD='"password"'
; -- Relay output pins (active-HIGH by default; set RELAY_ACTIVE_LOW=1 for active-LOW boards)
; -D RELAY_PIN_0=PA0
; -D RELAY_PIN_1=PA1
; -D RELAY_ACTIVE_LOW=1
; -- Digital input pins (INPUT_PULLUP; set INPUT_ACTIVE_LOW=1 if pulled low when active)
; -D INPUT_PIN_0=PB2
; -D INPUT_ACTIVE_LOW=1
build_src_filter = ${rak3x72.build_src_filter}
  +<../examples/simple_relay>
  +<../examples/simple_sensor/SensorMesh.cpp>
  +<../examples/simple_sensor/TimeSeriesData.cpp>

[env:RAK_3x72_companion_radio_usb]
extends = rak3x72
build_flags = ${rak3x72.build_flags}
;  -D FORMAT_FS=true
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
build_src_filter = ${rak3x72.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${rak3x72.lib_deps}
  densaugeo/base64 @ ~1.4.0
